[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "care-x"
version = "1.0.0"
description = "Capability-aware auditing for assistive healthcare AI workflows"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.2", "matplotlib>=3.9", "networkx>=3.3", "gradio>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

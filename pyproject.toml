[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "care-x"
version = "1.1.1"
description = "Capability-aware auditing for assistive healthcare AI workflows"
requires-python = ">=3.10"
dependencies = ["numpy==2.4.6", "pandas==3.0.5", "matplotlib==3.11.1", "networkx==3.6.1", "gradio==6.26.0", "scikit-learn==1.9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
